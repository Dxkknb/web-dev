<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>HTML Lists</title>
	<style>
		* {
			box-sizing: border-box;
			font-family: 'Roboto', 'Montserrat', sans-serif;
		}
		main {
			max-width: 700px;
			margin-inline: auto;
		}
		.row{
			height: 2px;
			background-color: #04AA6D;
		}
		.section {
			width: 100%;
			margin: 10px 0;
			padding: 10px;
			background-color: #EEF;
		}
		.menu-title {
			color: rebeccapurple;
			font-weight: 700;
			text-decoration: underline;
		}
		.menu-list {
		
		}
		.menu-list li {
			margin: 10px;
			font-size: 1.1rem;
		}
		.menu-sublist li {
			font-size: 1rem;
		}
		dt {
			margin: 10px 0;
			font-weight: 600;
		}
	</style>
</head>
<body>
	<main>
		<h1>HTML Lists</h1>
		<div class="row"></div>
		<section class="section">
			<h2>Unordered Lists</h2>
			<p class="menu-title">Menu:</p>
			<ul class="menu-list">
				<li>Coffee</li>
				<li>
					<span>Tea</span>
					<ul class="menu-list menu-sublist">
						<li>Black Tea</li>
						<li>Green Tea</li>
					</ul>
				</li>
				<li>Milk</li>
			</ul>
		</section>
		<section class="section">
			<h2>Ordered Lists</h2>
			<p class="menu-title">Menu:</p>
			<ol class="menu-list" type="1">
				<li>Coffee</li>
				<li>
					<span>Tea</span>
					<ol class="menu-list menu-sublist">
						<li>Black Tea</li>
						<li>Green Tea</li>
					</ol>
				</li>
				<li>Milk</li>
			</ol>
		</section>
		<section class="section">
			<h2>Definition Lists</h2>
			<dl>
				<dt>Coffee</dt>
				<dd> - Black hot drink</dd>
				<dt>Milk</dt>
				<dd> - White cold drink</dd>
			</dl>
		</section>
	</main>
</body>
</html>
