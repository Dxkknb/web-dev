<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./style.css">
    <title>Card</title>
</head>
<body>
<h2 class="main-title">Product Card</h2>
<main>
    <section class="container">
        <article class="product">
            <img class="product-img" src="https://static.actu.fr/uploads/2023/06/ruepietonne-nantes-960x640.jpg"
                 alt="Rue Nantes">
            <div class="product-content">
                <p class="product-category">Essentiel</p>
                <div class="product-infos">
                    <h3>Carnet</h3>
                    <span>12,00 &euro;</span>
                </div>
                <p class="product-description">
                    Une carte produit simple avec un titre, un texte et un lien.
                </p>
                <a class="product-link" href="#">Voir le produit</a>
            </div>
        </article>
    </section>
</main>
</body>
</html>
