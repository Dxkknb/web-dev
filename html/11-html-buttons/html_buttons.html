<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>HTML Buttons</title>
	<style>
		.container {
			max-width: 700px;
			margin-inline:auto;
		}
		.btn-normal {
			padding: 6px 15px;
			font-family: "Roboto", sans-serif;
			font-size: 17px;
		}
		.btn-disabled {
			background-color: #eef;
		}
		.btn-container {
			padding: 16px;
			margin: 8px 0;
			background-color: #eef;
		}
		label span {
			font-size: 20px;
		}
		.input {
			padding: 6px 16px;
			font-family: "Roboto", sans-serif;
			font-size: 17px;
		}
		form button {
			display: block;
			margin: 8px 0;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>HTML Buttons</h1>
		<hr>
		<section>
			<button class="btn-normal" onclick="alert('Hello world!')">Click Me</button>
			<button class="btn-normal btn-disabled" disabled>Disabled button</button>
		</section>
		<section>
			<h2>Button types</h2>
			<section class="btn-container">
				<h3>Normal button</h3>
				<button class="btn-normal" id="btn-normal">Show message</button>
			</section>
			<section class="btn-container">
				<h3>Submit & reset buttons</h3>
				<form action="#" method="post">
					<label for="firstname">
						<span>First name:</span>
						<input type="text" id="firstname" name="firstname" placeholder="First name" required
						       class="input">
					</label>
					<button type="submit" class="btn-normal">Submit</button>
					<button type="reset" class="btn-normal">Reset Form</button>
				</form>
			</section>
		</section>
	</div>
	<script>
		const normalBtn = document.querySelector('#btn-normal');
		normalBtn.addEventListener('click', () => {
			const p = document.querySelector('.text-muted');
			if(p){
				p.remove()
			}else{
				const paragraph = document.createElement('p');
				paragraph.classList.add('text-muted');
				paragraph.textContent = 'Hello my friend. I love HTML and CSS.';
				normalBtn.insertAdjacentElement("afterend", paragraph);
			}
		})
	</script>
</body>
</html>
