<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<style>
		main {
			max-width: 600px;
			margin-inline: auto;
		}
		.title {
			font-size: 25px;
			text-align: center;
		}
		label {
			display: inline-block;
			margin-right: 10px;
		}
		.form-section {
			margin: 10px 0;
			display: flex;
		}
		.form-section > input, select {
			width: 300px;
			padding: 4px 12px;
		}
	</style>
	<title>HTML Forms Example</title>
</head>
<body>
	<main>
		<h3 class="title">Contact Us Today</h3>
		<form action="#" method="POST">
			<div class="form-section">
				<label for="firstname">First Name</label>
				<input type="text" id="firstname" name="firstname" placeholder="First Name" required>
			</div>
			<div class="form-section">
				<label for="lastname">Last Name</label>
				<input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
			</div>
			<div class="form-section">
				<label for="email">E-Mail</label>
				<input type="email" id="email" name="email" placeholder="E-Mail Address" required>
			</div>
			<div class="form-section">
				<label for="phone">Phone #</label>
				<input type="tel" id="phone" name="phone" placeholder="(+225) 07 00 00 00 00" required>
			</div>
			<div class="form-section">
				<label for="city">City</label>
				<input type="text" id="city" name="city" placeholder="City" required>
			</div>
			<div class="form-section">
				<label for="state">State</label>
				<select name="state" id="state" aria-placeholder="Please select your state" required>
					<!-- Default display -->
					<option class="default-value">Please select you country</option>
					<option value="AL">Alabama</option>
					<option value="AK">Alaska</option>
					<option value="AZ">Arizona</option>
					<option value="AR">Arkansas</option>
					<option value="CA">California</option>
					<option value="CO">Colorado</option>
					<option value="CT">Connecticut</option>
					<option value="DE">Delaware</option>
					<option value="DC">District Of Columbia</option>
					<option value="FL">Florida</option>
					<option value="GA">Georgia</option>
					<option value="HI">Hawaii</option>
					<option value="ID">Idaho</option>
					<option value="IL">Illinois</option>
					<option value="IN">Indiana</option>
					<option value="IA">Iowa</option>
					<option value="KS">Kansas</option>
					<option value="KY">Kentucky</option>
					<option value="LA">Louisiana</option>
					<option value="ME">Maine</option>
					<option value="MD">Maryland</option>
					<option value="MA">Massachusetts</option>
					<option value="MI">Michigan</option>
					<option value="MN">Minnesota</option>
					<option value="MS">Mississippi</option>
					<option value="MO">Missouri</option>
					<option value="MT">Montana</option>
					<option value="NE">Nebraska</option>
					<option value="NV">Nevada</option>
					<option value="NH">New Hampshire</option>
					<option value="NJ">New Jersey</option>
					<option value="NM">New Mexico</option>
					<option value="NY">New York</option>
					<option value="NC">North Carolina</option>
					<option value="ND">North Dakota</option>
					<option value="OH">Ohio</option>
					<option value="OK">Oklahoma</option>
					<option value="OR">Oregon</option>
					<option value="PA">Pennsylvania</option>
					<option value="RI">Rhode Island</option>
					<option value="SC">South Carolina</option>
					<option value="SD">South Dakota</option>
					<option value="TN">Tennessee</option>
					<option value="TX">Texas</option>
					<option value="UT">Utah</option>
					<option value="VT">Vermont</option>
					<option value="VA">Virginia</option>
					<option value="WA">Washington</option>
				</select>
			</div>
			<div class="form-section">
				<label for="zipcode">Zip Code</label>
				<input type="text" id="zipcode" name="zipcode" placeholder="Zip Code">
			</div>
			<div class="form-section">
				<label for="website">Website or domain name</label>
				<input type="text" id="website" name="website" placeholder="Website or domain name">
			</div>
			<div class="form-section">
				<label for="hosting">Do you have hosting?</label>
				<div>
					<div>
						<input type="radio" name="hosting" id="hosting-yes" value="hosting">
						<span>Yes</span>
					</div>
					<div>
						<input type="radio" name="hosting" id="hosting-no" value="hosting">
						<span>No</span>
					</div>
				</div>
			</div>
			<div class="form-section">
				<label for="description">Project Description</label>
				<textarea
						id="description"
						name="description"
						placeholder="Project Description"
						rows="5"
						cols="50"
				></textarea>
			</div>
		</form>
	</main>
</body>
</html>
