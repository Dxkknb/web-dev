    <title>Attributes and properties</title>
    <style>
        .message[data-state='invalid'] {
            color: red;
            border-color: red;
            outline: none;
        }
        .message[data-state='valid'] {
            color: green;
            border-color: green;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Attributes and properties</h2>
        <form action="#" id="form">
            <input type="text" name="message" class="message" placeholder="Your message..." data-type="message" required>
            <input type="submit" value="Send">
        </form>
        <ul class="messages-container"></ul>
